spring.application.name=BookManager

# Every secret comes from environment variables (see .env.example).
# The defaults below are for local development only.
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=BookManagerDB;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.SQLServer2012Dialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

jwt.secret=${JWT_SECRET:local-dev-only-secret-change-me-local-dev-only-secret-change-me-0123}
server.port=${PORT:8080}
logging.level.com.yourpackage=info

spring.datasource.hikari.connectionTimeout=30000
spring.datasource.hikari.idleTimeout=600000
spring.datasource.hikari.maxLifetime=1800000
spring.datasource.hikari.minimumIdle=2
spring.datasource.hikari.maximumPoolSize=10

# Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.disable-swagger-default-url=true

# Security & CORS
spring.security.filter.dispatcher-types=REQUEST,FORWARD,ERROR,ASYNC
server.forward-headers-strategy=native

# Tomcat specific
server.tomcat.relaxed-query-chars=|,{,},[,]
server.tomcat.relaxed-path-chars=|,{,},[,]
# Demo accounts created on first start: admin / librarian / reader
app.seed.enabled=${SEED_DEMO_USERS:true}
app.seed.password=${DEMO_PASSWORD:Demo@1234}
